services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chicano
      POSTGRES_PASSWORD: chicano_dev_password
      POSTGRES_DB: chicano
    ports:
      - "5433:5432"
    volumes:
      - chicano_db_data:/var/lib/postgresql/data

volumes:
  chicano_db_data:
